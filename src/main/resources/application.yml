server:
  port: ${PORT:8080}
spring:
  application.name: civicshield-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/civicshield}
    username: ${SPRING_DATASOURCE_USERNAME:}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate.ddl-auto: validate
    properties.hibernate.jdbc.time_zone: UTC
  flyway.enabled: true
management.endpoints.web.exposure.include: health,info
civicshield.jwt.secret: ${JWT_SECRET:}
civicshield.jwt.expiration: ${JWT_EXPIRATION:PT8H}
---
spring.config.activate.on-profile: test
spring.datasource.url: jdbc:h2:mem:civicshield;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name: org.h2.Driver
spring.jpa.hibernate.ddl-auto: create-drop
spring.flyway.enabled: false
